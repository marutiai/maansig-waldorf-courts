<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waldorf Court Calendar</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#f4f6f8;color:#1c2833}
header{background:#1f4e79;color:#fff;padding:12px 16px}
header h1{font-size:18px;margin:0}
header p{margin:4px 0 0;font-size:12px;opacity:.8}
main{padding:12px;max-width:680px;margin:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid #d5dbe0;background:#fff;border-radius:20px;padding:8px 14px;font-size:15px}
.chip.on{background:#1f4e79;border-color:#1f4e79;color:#fff}
.day{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
.day h2{font-size:16px;margin:0 0 6px}
.slot{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #eef1f3;font-size:15px}
.slot b{min-width:110px}
.v{color:#5d6d7e}
.n{font-weight:600}
.n.g{color:#1e8449}.n.a{color:#b9770e}
.muted{color:#5d6d7e;font-size:13px}

.cal{background:#fff;border-radius:12px;padding:10px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead button{border:none;background:#eef1f3;border-radius:16px;padding:6px 14px;font-size:18px}
.calhead b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:#5d6d7e;padding:2px 0}
.cell{min-height:54px;border-radius:8px;background:#f7f9fa;padding:4px;font-size:13px;position:relative}
.cell.has{background:#eaf2fb;cursor:pointer}
.cell.sel{outline:2px solid #1f4e79}
.cell.past{opacity:.35}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:4px}
</style></head><body>
<header><h1>🏸 Waldorf Court Calendar</h1><p id="upd"></p></header>
<main>
<div class="chips" id="venues"></div>
<div class="chips">
  <button class="chip on" id="fits">Only 2+ courts, weekday eve / weekend</button>
</div>
<div class="cal"><div class="calhead"><button id="prev">‹</button><b id="mlabel"></b><button id="next">›</button></div>
<div class="legend" id="legend"></div>
<div class="grid" id="grid"></div></div>
<div id="list"><p class="muted">Tap a day to see the free slots.</p></div>
<p class="muted">Free courts are estimated from each venue's "% busy". Check on the booking site before booking. George Green's only shows the next 7 days.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const COL={'Royal Docks':'#1f4e79','Bow School':'#7d3c98','Somers Town':'#1e8449',"George Green's":'#b9770e'};
let D=[],venues=new Set(Object.keys(COL)),fits=true,month='all';
fetch('courts.json?'+Date.now()).then(r=>r.json()).then(j=>{D=j.slots;$('upd').textContent='Updated '+j.updated;draw();});
let ym=null,sel=null;
function chips(){
  $('venues').innerHTML=Object.keys(COL).map(v=>`<button class="chip ${venues.has(v)?'on':''}" data-v="${v}">${v}</button>`).join('');
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;venues.has(v)?venues.delete(v):venues.add(v);draw();});
  $('fits').className='chip '+(fits?'on':'');
  $('legend').innerHTML=Object.keys(COL).filter(v=>venues.has(v)).map(v=>`<span><i class="dot" style="background:${COL[v]}"></i>${v}</span>`).join('');
}
$('fits').onclick=()=>{fits=!fits;draw();};
$('prev').onclick=()=>{ym=new Date(ym.getFullYear(),ym.getMonth()-1,1);draw();};
$('next').onclick=()=>{ym=new Date(ym.getFullYear(),ym.getMonth()+1,1);draw();};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function draw(){
  if(!ym){const t=new Date();ym=new Date(t.getFullYear(),t.getMonth(),1);}
  chips();
  const rows=D.filter(s=>venues.has(s[2])&&(!fits||s[6]==='Yes'));
  const by={};rows.forEach(s=>(by[s[0]]=by[s[0]]||[]).push(s));
  $('mlabel').textContent=ym.toLocaleString('en-GB',{month:'long',year:'numeric'});
  const first=(ym.getDay()+6)%7, days=new Date(ym.getFullYear(),ym.getMonth()+1,0).getDate(), today=iso(new Date());
  let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div></div>';
  for(let d=1;d<=days;d++){const k=iso(new Date(ym.getFullYear(),ym.getMonth(),d)),sl=by[k]||[];
    const vs=[...new Set(sl.map(s=>s[2]))];
    h+=`<div class="cell ${sl.length?'has':''} ${k===sel?'sel':''} ${k<today?'past':''}" data-d="${k}"><b>${d}</b><div class="dots">${vs.map(v=>`<i class="dot" style="background:${COL[v]}"></i>`).join('')}</div></div>`;}
  $('grid').innerHTML=h;
  document.querySelectorAll('.cell.has').forEach(c=>c.onclick=()=>{sel=c.dataset.d;draw();});
  if(sel){const sl=by[sel]||[];const dt=new Date(sel);
    $('list').innerHTML=`<div class="day"><h2>${dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}</h2>${sl.length?sl.map(s=>`<div class="slot"><b>${s[3]}</b><span class="v" style="color:${COL[s[2]]}">${s[2]}</span><span class="n ${s[4]>=3?'g':'a'}">${s[4]} court${s[4]>1?'s':''}</span></div>`).join(''):'<p class="muted">Nothing free for these filters.</p>'}</div>`;}
}
</script></body></html>
